# Unpacks update.zip (uploaded to the repo root) over the repo, commits it, and starts "Build IPA".
# Runs on a cheap Linux machine and takes about a minute. Reusable: upload a new update.zip and
# run it again whenever there is an update.
# Run it from the Actions tab: Apply update -> Run workflow.
name: Apply update

on:
  workflow_dispatch:
    inputs:
      build:
        description: Start "Build IPA" afterwards
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unpack and commit
        run: |
          test -f update.zip || { echo "Upload update.zip to the repo root first"; exit 1; }
          unzip -o -q update.zip
          rm -- update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Apply update"
            git push
          fi

      - name: Start the IPA build
        if: inputs.build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-ipa.yml --ref "${{ github.ref_name }}"
