# Step 1. Unpacks bitperfect-update.zip (uploaded to the repo root) over the repo and commits it.
# Cheap: runs on a Linux machine, takes about a minute. Run it from the Actions tab:
#   1 - Extract update -> Run workflow.
# By default it then starts "2 - Build IPA" for you.
name: 1 - Extract update

on:
  workflow_dispatch:
    inputs:
      zip:
        description: Zip file in the repo root to unpack
        type: string
        default: bitperfect-update.zip
      build:
        description: Start "2 - Build IPA" afterwards
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unpack and commit
        env:
          ZIP: ${{ inputs.zip }}
        run: |
          test -f "$ZIP" || { echo "Upload $ZIP to the repo root first"; exit 1; }
          unzip -o -q "$ZIP"
          rm -- "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Add bit-perfect mode and sample-rate verification"
            git push
          fi

      - name: Start the IPA build
        if: inputs.build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 2-build-ipa.yml --ref "${{ github.ref_name }}"
