# Builds BitChord for a real iPhone on a GitHub Mac and saves an ad-hoc signed IPA that a
# sideloader (Feather, ESign, SideStore, AltStore, Sideloadly) can re-sign and install.
#
# Run it from the Actions tab: Build IPA -> Run workflow. Download the IPA from the finished
# run's Artifacts (BitChord-ipa, kept 14 days).
#
# Two caches make later builds faster (the first build after adding this file is still a cold one):
#   * Swift packages (the downloaded sources and the ONNX Runtime binaries): saved right after
#     they download, so a later stall or failure does not lose them.
#   * Xcode's compilation cache: unchanged files are reused instead of recompiled.
# Manage or delete caches under Actions -> Caches. Run with "Skip the caches" ticked if a build
# ever behaves strangely.
name: Build IPA

on:
  workflow_dispatch:
    inputs:
      skip_caches:
        description: Skip the caches (a fully clean build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-ipa
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tools
        run: |
          xcodebuild -version
          sysctl -n hw.ncpu

      # Microsoft deleted its ONNX Runtime package repository (2026-11-17). The bit-perfect update
      # already points at a mirror with the same source commit and SHA-256 checksums; this repeats
      # that rewrite only if an older Package.swift is still in the repo.
      - name: Use the mirrored ONNX Runtime package
        run: |
          perl -0pi -e 's#https://github.com/microsoft/onnxruntime-swift-package-manager#https://github.com/FutureWorkshops/onnxruntime-swift-package-manager#g; s#exact: "1\.24\.2"#exact: "1.24.3"#' BitChordKit/Package.swift
          perl -0pi -e 's#https://github.com/microsoft/onnxruntime-swift-package-manager#https://github.com/FutureWorkshops/onnxruntime-swift-package-manager#g; s#b7fb7f7dea8a2469e6335d95a61b8f36d0dc83b2#4107b7abd4cdeb3212de58be2b24fc9844ad44ac#; s#"version" : "1\.24\.2"#"version" : "1.24.3"#' BitChordKit/Package.resolved
          grep -n "onnxruntime" BitChordKit/Package.swift BitChordKit/Package.resolved

      # ---- Swift packages (cached) ----
      - name: Restore the Swift package cache
        id: spm
        if: ${{ !inputs.skip_caches }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived-release/SourcePackages
          key: spm-v1-${{ runner.os }}-${{ hashFiles('BitChordKit/Package.resolved') }}
          restore-keys: spm-v1-${{ runner.os }}-

      # Each attempt is cut off after 7 minutes and retried; -verbose shows which download is slow.
      - name: Fetch Swift packages
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          for attempt in 1 2 3; do
            if perl -e 'alarm 420; exec @ARGV' xcodebuild -resolvePackageDependencies \
                 -workspace BitChord.xcworkspace -scheme BitChord -derivedDataPath .derived-release \
                 -skipPackagePluginValidation -skipMacroValidation -verbose; then
              exit 0
            fi
            echo "Resolve attempt $attempt failed or timed out; retrying in 15 s"
            pkill -f xcodebuild || true
            sleep 15
          done
          exit 1

      - name: Save the Swift package cache
        if: ${{ !inputs.skip_caches && steps.spm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived-release/SourcePackages
          key: spm-v1-${{ runner.os }}-${{ hashFiles('BitChordKit/Package.resolved') }}

      # ---- Xcode compilation cache ----
      # Turns on Xcode's compilation caching for every build in this job. It only helps when the
      # checkout path stays the same, which it does on these runners.
      - name: Turn on Xcode compilation caching
        if: ${{ !inputs.skip_caches }}
        run: |
          echo 'COMPILATION_CACHE_ENABLE_CACHING = YES' > "$RUNNER_TEMP/ci.xcconfig"
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/ci.xcconfig" >> "$GITHUB_ENV"

      - name: Restore the compilation cache
        if: ${{ !inputs.skip_caches }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            .derived-release/CompilationCache.noindex
          key: cc-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: cc-v1-${{ runner.os }}-

      - name: Build the IPA
        env:
          JOBS: "3"
        run: scripts/make-ipa.sh

      - name: Save the compilation cache
        if: ${{ !inputs.skip_caches }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            .derived-release/CompilationCache.noindex
          key: cc-v1-${{ runner.os }}-${{ github.sha }}

      - name: Show cache sizes
        if: ${{ !inputs.skip_caches }}
        run: du -sh .derived-release/SourcePackages ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex .derived-release/CompilationCache.noindex 2>/dev/null || true

      - name: Upload the IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BitChord-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14
