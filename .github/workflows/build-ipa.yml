# Builds BitChord for a real iPhone on a GitHub Mac and saves an ad-hoc signed IPA that a
# sideloader (Feather, ESign, SideStore, AltStore, Sideloadly) can re-sign and install.
#
# Run it from the Actions tab: Build IPA -> Run workflow. Download the IPA from the finished
# run's Artifacts (BitChord-ipa, kept 14 days).
#
# Two caches make later builds faster (the first build after adding this file is still a cold one):
#   * Swift packages (the downloaded sources and the ONNX Runtime binaries): saved right after
#     they download, so a later stall or failure does not lose them.
#   * Xcode's compilation cache: unchanged files are reused instead of recompiled.
# Manage or delete caches under Actions -> Caches. Run with "Skip the caches" ticked if a build
# ever behaves strangely.
name: Build IPA

on:
  workflow_dispatch:
    inputs:
      skip_caches:
        description: Skip the caches (a fully clean build)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-ipa
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tools
        run: |
          xcodebuild -version
          sysctl -n hw.ncpu

      # ---- ONNX Runtime, downloaded by this workflow instead of by Xcode ----
      # Microsoft deleted its ONNX Runtime package repository (2026-11-17). Letting Xcode download
      # the mirror's two large binaries hung for 20+ minutes in earlier runs, so they are fetched
      # here with timeouts and retries, checked against Microsoft's SHA-256 checksums, and used as
      # a local package. The mirror's source is Microsoft's own commit with only two URLs changed.
      - name: Restore the ONNX Runtime copy
        id: onnx
        if: ${{ !inputs.skip_caches }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ThirdParty/onnxruntime-swift-package-manager
          key: onnx-v1-1.24.3

      - name: Download ONNX Runtime
        if: ${{ steps.onnx.outputs.cache-hit != 'true' }}
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf ThirdParty/onnxruntime-swift-package-manager
          mkdir -p ThirdParty
          git clone --depth 1 --branch 1.24.3 https://github.com/FutureWorkshops/onnxruntime-swift-package-manager.git ThirdParty/onnxruntime-swift-package-manager
          cd ThirdParty/onnxruntime-swift-package-manager
          test "$(git rev-parse HEAD)" = "4107b7abd4cdeb3212de58be2b24fc9844ad44ac"
          rm -rf .git
          for f in pod-archive-onnxruntime-c-1.24.2.zip pod-archive-onnxruntime-extensions-c-0.13.0.zip; do
            ok=0
            for attempt in 1 2 3; do
              if curl -fL --retry 2 --connect-timeout 20 --max-time 300 -sS -o "$f" \
                   "https://github.com/FutureWorkshops/onnxruntime-swift-package-manager/releases/download/1.24.3/$f"; then
                ok=1; break
              fi
              echo "Download of $f failed (attempt $attempt)"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "Could not download $f"; exit 1; }
            ls -l "$f"
          done
          shasum -a 256 -c <<'SUMS'
          f7100a992d2a8135168c8afd831e6a58b465349101982aa58b3e11d36e600b54  pod-archive-onnxruntime-c-1.24.2.zip
          346522d1171d4c99cb0908fa8e4e9330a4a6aad39cd83ce36eb654437b33e6b5  pod-archive-onnxruntime-extensions-c-0.13.0.zip
          SUMS
          python3 - <<'PY'
          s = open("Package.swift").read()
          i = s.index("// Add the ORT CocoaPods C/C++ pod archive as a binary target.")
          s = s[:i] + (
              "// Local archives, downloaded and checksum-verified by the CI workflow.\n"
              'package.targets.append(Target.binaryTarget(name: "onnxruntime", path: "pod-archive-onnxruntime-c-1.24.2.zip"))\n'
              'package.targets.append(Target.binaryTarget(name: "onnxruntime_extensions", path: "pod-archive-onnxruntime-extensions-c-0.13.0.zip"))\n'
          )
          open("Package.swift", "w").write(s)
          PY

      - name: Save the ONNX Runtime copy
        if: ${{ !inputs.skip_caches && steps.onnx.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ThirdParty/onnxruntime-swift-package-manager
          key: onnx-v1-1.24.3

      - name: Point BitChordKit at the local ONNX Runtime
        run: |
          python3 - <<'PY'
          import json, re
          p = "BitChordKit/Package.swift"
          s = open(p).read()
          s, n = re.subn(r'\.package\(url: "https://github\.com/(?:microsoft|FutureWorkshops)/onnxruntime-swift-package-manager", exact: "[0-9.]+"\),',
                         '.package(path: "../ThirdParty/onnxruntime-swift-package-manager"),', s)
          if n == 0 and "../ThirdParty/onnxruntime-swift-package-manager" not in s:
              raise SystemExit("ONNX Runtime dependency line not found in BitChordKit/Package.swift")
          open(p, "w").write(s)
          p = "BitChordKit/Package.resolved"
          r = json.load(open(p))
          r["pins"] = [x for x in r["pins"] if x["identity"] != "onnxruntime-swift-package-manager"]
          json.dump(r, open(p, "w"), indent=2)
          PY
          grep -n "onnxruntime" BitChordKit/Package.swift

      # ---- Swift packages (cached) ----
      - name: Restore the Swift package cache
        id: spm
        if: ${{ !inputs.skip_caches }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived-release/SourcePackages
          key: spm-v1-${{ runner.os }}-${{ hashFiles('BitChordKit/Package.resolved') }}
          restore-keys: spm-v1-${{ runner.os }}-

      # Each attempt is cut off after 7 minutes and retried; -verbose shows which download is slow.
      - name: Fetch Swift packages
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          for attempt in 1 2 3; do
            if perl -e 'alarm 420; exec @ARGV' xcodebuild -resolvePackageDependencies \
                 -workspace BitChord.xcworkspace -scheme BitChord -derivedDataPath .derived-release \
                 -skipPackagePluginValidation -skipMacroValidation -verbose; then
              exit 0
            fi
            echo "Resolve attempt $attempt failed or timed out; retrying in 15 s"
            pkill -f xcodebuild || true
            sleep 15
          done
          exit 1

      - name: Save the Swift package cache
        if: ${{ !inputs.skip_caches && steps.spm.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .derived-release/SourcePackages
          key: spm-v1-${{ runner.os }}-${{ hashFiles('BitChordKit/Package.resolved') }}

      # ---- Xcode compilation cache ----
      # Turns on Xcode's compilation caching for every build in this job. It only helps when the
      # checkout path stays the same, which it does on these runners.
      - name: Turn on Xcode compilation caching
        if: ${{ !inputs.skip_caches }}
        run: |
          echo 'COMPILATION_CACHE_ENABLE_CACHING = YES' > "$RUNNER_TEMP/ci.xcconfig"
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/ci.xcconfig" >> "$GITHUB_ENV"

      - name: Restore the compilation cache
        if: ${{ !inputs.skip_caches }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            .derived-release/CompilationCache.noindex
          key: cc-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: cc-v1-${{ runner.os }}-

      - name: Build the IPA
        env:
          JOBS: "3"
        run: scripts/make-ipa.sh

      - name: Save the compilation cache
        if: ${{ !inputs.skip_caches }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
            .derived-release/CompilationCache.noindex
          key: cc-v1-${{ runner.os }}-${{ github.sha }}

      - name: Show cache sizes
        if: ${{ !inputs.skip_caches }}
        run: du -sh .derived-release/SourcePackages ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex .derived-release/CompilationCache.noindex 2>/dev/null || true

      - name: Upload the IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BitChord-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14