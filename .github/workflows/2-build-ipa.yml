# Step 2. Builds BitChord for a real iPhone on a GitHub Mac and saves an ad-hoc signed IPA that
# you can sideload (SideStore, AltStore, Sideloadly). Takes a while (about 30-60 minutes).
# Run it from the Actions tab: 2 - Build IPA -> Run workflow (step 1 can also start it).
# Download the IPA from the finished run's Artifacts: BitChord-ipa (kept 14 days).
name: 2 - Build IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tools
        run: |
          xcodebuild -version
          sysctl -n hw.ncpu

      # Microsoft deleted its ONNX Runtime package repository (2026-11-17). The update already
      # points at a mirror with the same source commit and the same SHA-256 checksums; this only
      # repeats that rewrite if an older Package.swift is still in the repo.
      - name: Use the mirrored ONNX Runtime package
        run: |
          perl -0pi -e 's#https://github.com/microsoft/onnxruntime-swift-package-manager#https://github.com/FutureWorkshops/onnxruntime-swift-package-manager#g; s#exact: "1\.24\.2"#exact: "1.24.3"#' BitChordKit/Package.swift
          perl -0pi -e 's#https://github.com/microsoft/onnxruntime-swift-package-manager#https://github.com/FutureWorkshops/onnxruntime-swift-package-manager#g; s#b7fb7f7dea8a2469e6335d95a61b8f36d0dc83b2#4107b7abd4cdeb3212de58be2b24fc9844ad44ac#; s#"version" : "1\.24\.2"#"version" : "1.24.3"#' BitChordKit/Package.resolved
          grep -n "onnxruntime" BitChordKit/Package.swift BitChordKit/Package.resolved

      - name: Fetch Swift packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -workspace BitChord.xcworkspace -scheme BitChord \
                 -derivedDataPath .derived-release -skipPackagePluginValidation -skipMacroValidation; then
              exit 0
            fi
            echo "Resolve attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          exit 1

      - name: Build the IPA
        env:
          JOBS: "3"
        run: scripts/make-ipa.sh

      - name: Upload the IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BitChord-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14
