# One-button workflow for building without a Mac or a computer.
# It applies bitchord-bitperfect.patch (upload that file to the repo root first), builds an
# ad-hoc signed IPA for sideloading, and on success commits the patched files to the branch.
# Run it from the Actions tab: Apply patch and build IPA -> Run workflow.
name: Apply patch and build IPA

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply the patch
        run: |
          test -f bitchord-bitperfect.patch || { echo "Upload bitchord-bitperfect.patch to the repo root first"; exit 1; }
          if patch -p1 -R --dry-run -s < bitchord-bitperfect.patch > /dev/null 2>&1; then
            echo "Patch already applied"
          else
            patch -p1 < bitchord-bitperfect.patch
          fi

      # Microsoft deleted its ONNX Runtime package repository (2026-11-17). Whatever version of the
      # patch was applied, make sure the build uses the verified mirror (same source commit, same
      # SHA-256 checksums); this does nothing if the patch already did it.
      - name: Use the mirrored ONNX Runtime package
        run: |
          perl -0pi -e 's#https://github.com/microsoft/onnxruntime-swift-package-manager#https://github.com/FutureWorkshops/onnxruntime-swift-package-manager#g; s#exact: "1\.24\.2"#exact: "1.24.3"#' BitChordKit/Package.swift
          perl -0pi -e 's#https://github.com/microsoft/onnxruntime-swift-package-manager#https://github.com/FutureWorkshops/onnxruntime-swift-package-manager#g; s#b7fb7f7dea8a2469e6335d95a61b8f36d0dc83b2#4107b7abd4cdeb3212de58be2b24fc9844ad44ac#; s#"version" : "1\.24\.2"#"version" : "1.24.3"#' BitChordKit/Package.resolved
          grep -n "onnxruntime" BitChordKit/Package.swift BitChordKit/Package.resolved

      # The first run failed cloning a dependency anonymously ("could not read Username"). Cloning
      # as the workflow's own token avoids anonymous limits, and each resolve is retried.
      - name: Fetch Swift packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -workspace BitChord.xcworkspace -scheme BitChord \
                 -derivedDataPath .derived-release -skipPackagePluginValidation -skipMacroValidation; then
              exit 0
            fi
            echo "Resolve attempt $attempt failed; retrying in 20 s"
            sleep 20
          done
          exit 1

      - name: Kit tests
        continue-on-error: true
        working-directory: BitChordKit
        run: swift test -j "$(sysctl -n hw.ncpu)" --filter RateSupportCacheTests

      - name: Build the IPA
        env:
          JOBS: "3"
        run: scripts/make-ipa.sh

      - name: Upload the IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BitChord-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Commit the patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u App BitChordKit
          git add BitChordKit/Tests/PlaybackTests/BitPerfectModeTests.swift
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add bit-perfect mode and sample-rate verification"
            git push
          fi
