# Publishes the IPA from the latest successful "Build IPA" run as a GitHub Release. Reusable: run it
# again for every version.
#
# Add or change this file by hand on github.com (Add file -> Create new file ->
# .github/workflows/release-ipa.yml). The "Apply update" workflow cannot add or change files in
# .github/workflows.
#
# Order: 1) Actions -> Apply update (it starts Build IPA)  2) wait for Build IPA to succeed
#        3) Actions -> Release IPA -> Run workflow.
# The version is read from the IPA itself, so there is nothing to type. The release notes come from
# docs/release-<version>.md in the repo (docs/release-0.1.1.md for version 0.1.1), so write that
# file before releasing a new version.
name: Release IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release. Leave empty to use the version inside the IPA
        type: string
        default: ""
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the IPA from the latest successful build
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --workflow build-ipa.yml --branch "${{ github.ref_name }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] || { echo "No successful Build IPA run found. Run Apply update (or Build IPA) first."; exit 1; }
          echo "Using Build IPA run $RUN_ID"
          gh run download "$RUN_ID" --name BitChord-ipa --dir dl
          ls -l dl
          test "$(ls dl/*.ipa | wc -l)" = 1 || { echo "Expected exactly one IPA"; exit 1; }

      - name: Read the version and rename the IPA
        run: |
          set -euo pipefail
          SRC=$(ls dl/*.ipa)
          unzip -p "$SRC" "Payload/BitChord.app/Info.plist" > Info.plist
          INSIDE=$(python3 -c 'import plistlib;print(plistlib.load(open("Info.plist","rb"))["CFBundleShortVersionString"])')
          BUILD=$(python3 -c 'import plistlib;print(plistlib.load(open("Info.plist","rb"))["CFBundleVersion"])')
          echo "Version inside the IPA: $INSIDE (build $BUILD)"
          WANTED=$(echo "$REQUESTED" | xargs)
          WANTED="${WANTED#v}"
          if [ -n "$WANTED" ] && [ "$INSIDE" != "$WANTED" ]; then
            echo "The IPA is version $INSIDE but you asked for $WANTED. Run Build IPA again after applying the update."
            exit 1
          fi
          {
            echo "VERSION=$INSIDE"
            echo "BUILD=$BUILD"
          } >> "$GITHUB_ENV"
          mkdir -p release
          cp "$SRC" "release/BitChord-$INSIDE-unsigned.ipa"
          ls -l release

      - name: Write the release notes
        run: |
          set -euo pipefail
          NOTES="docs/release-$VERSION.md"
          test -f "$NOTES" || { echo "Missing $NOTES. Write the release notes for $VERSION first."; exit 1; }
          IPA="release/BitChord-$VERSION-unsigned.ipa"
          SHA=$(sha256sum "$IPA" | cut -d' ' -f1)
          SIZE=$(du -h "$IPA" | cut -f1)
          cp "$NOTES" notes.md
          {
            printf '\n## Checksum\n\n'
            printf 'File: `BitChord-%s-unsigned.ipa` (%s), version %s, build %s\n\n' "$VERSION" "$SIZE" "$VERSION" "$BUILD"
            printf 'SHA-256:\n\n```\n%s\n```\n' "$SHA"
          } >> notes.md

      - name: Create or update the release
        run: |
          set -euo pipefail
          IPA="release/BitChord-$VERSION-unsigned.ipa"
          FLAGS=""
          [ "${{ inputs.prerelease }}" = "true" ] && FLAGS="--prerelease"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION exists: replacing its IPA and notes"
            gh release upload "v$VERSION" "$IPA" --clobber
            gh release edit "v$VERSION" --title "BitChord $VERSION" --notes-file notes.md $FLAGS
          else
            gh release create "v$VERSION" "$IPA" --title "BitChord $VERSION" --notes-file notes.md --target "${{ github.sha }}" $FLAGS
          fi
          gh release view "v$VERSION" --json url --jq .url
